            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/SelcukFlix.cs3", "name": "SelcukFlix"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/SetFilmIzle.cs3", "name": "SetFilmIzle"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/SezonlukDizi.cs3", "name": "SezonlukDizi"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/SinemaCX.cs3", "name": "SinemaCX"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/SineWix.cs3", "name": "SineWix"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/Sinezy.cs3", "name": "Sinezy"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/TrAnimeIzle.cs3", "name": "TrAnimeIzle"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/TurkAnime.cs3", "name": "TurkAnime"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/Turkdizileri.cs3", "name": "Turkdizileri"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/TvDiziler.cs3", "name": "TvDiziler"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/WebDramaTurkey.cs3", "name": "WebDramaTurkey"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/WebteIzle.cs3", "name": "WebteIzle"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/WFilmizle.cs3", "name": "WFilmizle"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/YabanciDizi.cs3", "name": "YabanciDizi"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/YeniKaynak.cs3", "name": "YeniKaynak"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/YesilCamTv.cs3", "name": "YesilCamTv"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/Youtube.cs3", "name": "Youtube"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/YTS.cs3", "name": "YTS"}
          ]

          OUTPUT_DIR = "decompiled_src"
          os.makedirs(OUTPUT_DIR, exist_ok=True)

          def main():
              print("Dosyalar indiriliyor ve JADX ile çözülüyor...")
              for item in plugin_data:
                  url = item.get("url")
                  name = item.get("name")
                  
                  if not url or not name:
                      continue

                  try:
                      temp_file = f"{name}.cs3"
                      # Dosyayı binary olarak indir
                      response = requests.get(url, timeout=15)
                      if response.status_code == 200:
                          with open(temp_file, "wb") as f:
                              f.write(response.content)
                          
                          out_folder = os.path.join(OUTPUT_DIR, name)
                          print(f"{name} decompile ediliyor...")
                          
                          # jadx ile classes.dex dosyasını Java'ya çevir
                          subprocess.run(
                              ["jadx", "-d", out_folder, "--no-res", "--no-src-storage", temp_file],
                              stdout=subprocess.DEVNULL, 
                              stderr=subprocess.DEVNULL
                          )
                          
                          os.remove(temp_file)
                          print(f"Başarılı: {name} kaynak kodları çıkarıldı.")
                      else:
                          print(f"Hata: {name} indirilemedi (HTTP {response.status_code})")
                  except Exception as e:
                      print(f"Hata oluştu ({name}): {e}")

          if __name__ == "__main__":
              main()
          EOF
          python decompiler.py

      - name: Değişiklikleri Depoya Kaydet (Commit & Push)
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add decompiled_src/
          
          # Hata vermemesi için güvenli commit kontrolü
          if ! git diff --staged --quiet; then
            git commit -m "Eklentiler CS3 dex paketinden Java kaynak koduna dönüştürüldü"
            git push
          else
            echo "Değişiklik bulunamadı, commit atlanıyor."
          fi
