            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/Dizipod.cs3", "name": "Dizipod"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/DiziYo.cs3", "name": "DiziYo"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/DiziYou.cs3", "name": "DiziYou"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/DramaDizilerim.cs3", "name": "DramaDizilerim"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/FilmEkseni.cs3", "name": "FilmEkseni"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/FilmHane.cs3", "name": "FilmHane"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/FilmMakinesi.cs3", "name": "FilmMakinesi"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/FilmModu.cs3", "name": "FilmModu"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/Filmzal.cs3", "name": "Filmzal"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/FullHDFilmizlesene.cs3", "name": "FullHDFilmizlesene"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/GinikoCanli.cs3", "name": "GinikoCanli"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/HDFilmCehennemi.cs3", "name": "HDFilmCehennemi"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/HDFilmDelisi.cs3", "name": "HDFilmDelisi"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/HDFilmizle.cs3", "name": "HDFilmizle"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/InatBox.cs3", "name": "InatBox"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/JetFilmizle.cs3", "name": "JetFilmizle"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/KickTR.cs3", "name": "KickTR"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/KraptorPlus.cs3", "name": "KraptorPlus"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/KultFilmler.cs3", "name": "KultFilmler"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/MirrorVerse.cs3", "name": "MirrorVerse"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/OnePaceTr.cs3", "name": "OnePaceTr"},
