            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/CizgiMax.cs3", "name": "CizgiMax"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/CizgiveDizi.cs3", "name": "CizgiveDizi"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/Ddizi.cs3", "name": "Ddizi"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/DiziAsia.cs3", "name": "DiziAsia"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/DiziAsya.cs3", "name": "DiziAsya"},
