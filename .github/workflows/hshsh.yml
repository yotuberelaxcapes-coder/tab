name: CS3 Decompiler and Extractor

on:
  workflow_dispatch: 
  push:
    branches:
      - main 

permissions:
  contents: write

jobs:
  build-and-decompile:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v3

      - name: Java Kurulumu (JADX için gerekli)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: JADX Kurulumu (Decompiler)
        run: |
          wget https://github.com/skylot/jadx/releases/download/v1.4.7/jadx-1.4.7.zip
          unzip jadx-1.4.7.zip -d jadx
          sudo ln -s $(pwd)/jadx/bin/jadx /usr/local/bin/jadx

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli Python Kütüphanelerini Kur
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Dönüştürücü Python Betiğini Oluştur ve Çalıştır
        run: |
          cat << 'EOF' > decompiler.py
          import os
          import requests
          import subprocess

