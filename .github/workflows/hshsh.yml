            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/Dizigecesi.cs3", "name": "Dizigecesi"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/DiziKorea.cs3", "name": "DiziKorea"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/DiziLife.cs3", "name": "DiziLife"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/Dizilla.cs3", "name": "Dizilla"},
