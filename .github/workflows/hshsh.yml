name: CS3 Decompiler to Java (JADX - Debug)

on:
  workflow_dispatch:
  push:
    branches:
      - main 

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v3

      - name: Java 17 Kurulumu
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: JADX İndir ve Kur
        run: |
          wget https://github.com/skylot/jadx/releases/download/v1.4.7/jadx-1.4.7.zip -O jadx.zip
          unzip jadx.zip -d jadx_tool
          chmod +x jadx_tool/bin/jadx

      - name: Python Ortamı Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Python Bağımlılıkları
        run: pip install requests

      - name: Decompiler Betiğini Çalıştır
        run: |
          cat << 'EOF' > decompile_script.py
          import os
          import requests
          import subprocess
          import zipfile
          import shutil

          # Test için listeyi kısalttım, sorunun nerede olduğunu hızlıca bulalım
          # Eğer bu çalışırsa, eski uzun listeni tekrar koyabilirsin.
          plugin_data = [
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/AnimeciX.cs3", "name": "AnimeciX"},
            {"url": "https://raw.githubusercontent.com/Kraptor123/cs-kraptor/builds/Animeler.cs3", "name": "Animeler"}
          ]

          OUTPUT_DIR = "java_src"
          os.makedirs(OUTPUT_DIR, exist_ok=True)

          def main():
              print("İşlem başlıyor...")
              
              for item in plugin_data:
                  url = item.get("url")
                  name = item.get("name")
                  
                  try:
                      temp_cs3 = f"{name}.cs3"
                      temp_dir = f"temp_{name}"
                      
                      print(f"\n[{name}] indiriliyor...")
                      resp = requests.get(url, timeout=15)
                      if resp.status_code == 200:
                          with open(temp_cs3, "wb") as f:
                              f.write(resp.content)
                          
                          os.makedirs(temp_dir, exist_ok=True)
                          with zipfile.ZipFile(temp_cs3, 'r') as zip_ref:
                              zip_ref.extractall(temp_dir)
                          
                          dex_path = os.path.join(temp_dir, "classes.dex")
                          
                          if os.path.exists(dex_path):
                              out_folder = os.path.join(OUTPUT_DIR, name)
                              print(f"[{name}] classes.dex bulundu. JADX başlatılıyor...")
                              
                              # DİKKAT: DEVNULL kaldırıldı, artık JADX'in ne yaptığını göreceğiz.
                              subprocess.run([
                                  "./jadx_tool/bin/jadx", 
                                  "-d", out_folder, 
                                  "--no-res", 
                                  "--no-src-storage", 
                                  dex_path
                              ])
                              
                              print(f"[{name}] işlemi tamamlandı.")
                          else:
                              print(f"[{name}] İÇİNDE CLASSES.DEX YOK!")
                          
                          os.remove(temp_cs3)
                          shutil.rmtree(temp_dir)
                      else:
                          print(f"[{name}] İNDİRİLEMEDİ! HTTP {resp.status_code}")
                          
                  except Exception as e:
                      print(f"[{name}] HATA: {str(e)}")

          if __name__ == "__main__":
              main()
          EOF
          python decompile_script.py

      - name: Klasörlerin İçini Kontrol Et (Debug)
        run: |
          echo "--- java_src KLASÖRÜNÜN İÇİ ---"
          ls -R java_src/ || echo "Klasör boş veya yok!"

      - name: Değişiklikleri Depoya Kaydet (Commit & Push)
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add java_src/
          
          # Force status check
          git status
          
          if ! git diff --staged --quiet; then
            git commit -m "Eklentilerin kaynak kodları (Java) başarıyla eklendi"
            git push
          else
            echo "Değişiklik bulunamadı, commit atlanıyor."
          fi
