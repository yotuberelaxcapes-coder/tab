name: CS3 Decompiler to Java

on:
  workflow_dispatch:
  push:
    branches:
      - main 

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v3

      - name: Java 17 Kurulumu
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gerekli Araçları İndir (Dex2Jar & CFR)
        run: |
          # Dex dosyalarını Jar'a çeviren araç
          wget https://github.com/pxb1988/dex2jar/releases/download/v2.1/dex-tools-2.1.zip
          unzip dex-tools-2.1.zip -d dex2jar
          chmod +x dex2jar/d2j-dex2jar.sh
          
          # Jar dosyalarını Java koduna çeviren decompiler (CFR)
          wget https://github.com/leibnitz27/cfr/releases/download/0.152/cfr-0.152.jar -O cfr.jar

      - name: Python Ortamı Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Python Bağımlılıkları
        run: pip install requests

      - name: Decompiler Betiğini Oluştur ve Çalıştır
        run: |
          cat << 'EOF' > decompile_script.py
          import os
          import requests
          import subprocess
          import zipfile
          import shutil

