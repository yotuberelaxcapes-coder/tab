name: 7/24 Kesintisiz TV Yayini

on:
  schedule:
    - cron: '0 */6 * * *'  # Her 6 saatte bir otomatik olarak tetiklenir
  workflow_dispatch:       # İstediğin zaman GitHub üzerinden manuel başlatabilmen için

# Bu kısım çok önemli: Yeni görev başladığında eskisini anında öldürür. 
# Böylece aynı anda iki yayın gönderip sunucuyu çökertmez ve senin istediğin "saniyelik dur-başla" döngüsünü kurar.
concurrency:
  group: livestream
  cancel-in-progress: true 

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python 3.10 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: pip install requests

      - name: FFmpeg Kurulumu
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Yayını Başlat
        run: python stream.py
