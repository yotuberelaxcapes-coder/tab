name: 7/24 Kesintisiz TV Yayini

on:
  schedule:
    - cron: '0 */6 * * *' 
  workflow_dispatch:      

concurrency:
  group: livestream
  cancel-in-progress: true 

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python 3.10 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: pip install requests

      # apt-get yerine bu hazır aksiyonu kullanıyoruz (Kurulum 1-2 saniye sürer)
      - name: FFmpeg Hızlı Kurulum
        uses: FedericoCarboni/setup-ffmpeg@v3
        id: setup-ffmpeg

      - name: Yayını Başlat
        run: python stream.py
